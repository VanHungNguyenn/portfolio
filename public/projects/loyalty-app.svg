<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="450" fill="#112240"/>
  <!-- Phone frame -->
  <rect x="280" y="20" width="240" height="410" rx="24" fill="#0a192f" stroke="#1d3461" stroke-width="2"/>
  <rect x="340" y="30" width="120" height="6" rx="3" fill="#1d3461"/>
  <!-- Status bar -->
  <rect x="300" y="50" width="200" height="12" rx="3" fill="#1d3461" opacity="0.5"/>
  <!-- QR area -->
  <rect x="320" y="80" width="160" height="160" rx="12" fill="#1d3461"/>
  <rect x="350" y="110" width="100" height="100" fill="#233554"/>
  <rect x="360" y="120" width="20" height="20" fill="#64ffda" opacity="0.3"/>
  <rect x="390" y="120" width="20" height="20" fill="#8892b0" opacity="0.2"/>
  <rect x="420" y="120" width="20" height="20" fill="#64ffda" opacity="0.3"/>
  <rect x="360" y="150" width="20" height="20" fill="#8892b0" opacity="0.2"/>
  <rect x="390" y="150" width="20" height="20" fill="#64ffda" opacity="0.2"/>
  <rect x="420" y="150" width="20" height="20" fill="#8892b0" opacity="0.2"/>
  <rect x="360" y="180" width="20" height="20" fill="#64ffda" opacity="0.3"/>
  <rect x="390" y="180" width="20" height="20" fill="#8892b0" opacity="0.2"/>
  <rect x="420" y="180" width="20" height="20" fill="#64ffda" opacity="0.3"/>
  <text x="400" y="265" text-anchor="middle" fill="#8892b0" font-family="monospace" font-size="11">Scan to Check In</text>
  <!-- Stamp cards -->
  <rect x="300" y="290" width="200" height="50" rx="8" fill="#1d3461"/>
  <circle cx="325" cy="315" r="10" fill="#64ffda" opacity="0.3"/>
  <circle cx="355" cy="315" r="10" fill="#64ffda" opacity="0.3"/>
  <circle cx="385" cy="315" r="10" fill="#64ffda" opacity="0.3"/>
  <circle cx="415" cy="315" r="10" fill="#64ffda" opacity="0.15"/>
  <circle cx="445" cy="315" r="10" fill="#233554"/>
  <circle cx="475" cy="315" r="10" fill="#233554"/>
  <!-- Bottom nav -->
  <rect x="300" y="360" width="200" height="50" rx="8" fill="#1d3461" opacity="0.5"/>
  <rect x="320" y="375" width="30" height="4" rx="2" fill="#64ffda" opacity="0.4"/>
  <rect x="370" y="375" width="30" height="4" rx="2" fill="#233554"/>
  <rect x="420" y="375" width="30" height="4" rx="2" fill="#233554"/>
  <rect x="470" y="375" width="10" height="4" rx="2" fill="#233554"/>
  <!-- Location pin -->
  <circle cx="120" cy="225" r="40" fill="none" stroke="#64ffda" stroke-width="1" stroke-dasharray="4" opacity="0.3"/>
  <circle cx="120" cy="225" r="6" fill="#64ffda" opacity="0.5"/>
  <text x="120" y="285" text-anchor="middle" fill="#64ffda" font-family="monospace" font-size="9" opacity="0.6">Geofence</text>
  <!-- Notification -->
  <rect x="560" y="100" width="180" height="60" rx="10" fill="#1d3461" stroke="#233554" stroke-width="1"/>
  <rect x="575" y="115" width="100" height="8" rx="2" fill="#ccd6f6" opacity="0.4"/>
  <rect x="575" y="130" width="150" height="6" rx="2" fill="#8892b0" opacity="0.3"/>
  <rect x="575" y="142" width="120" height="6" rx="2" fill="#8892b0" opacity="0.2"/>
</svg>
